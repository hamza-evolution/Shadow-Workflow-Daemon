<svg viewBox="0 0 880 220" width="100%" xmlns="http://w3.org">
      <rect width="880" height="220" rx="12" fill="#030712" stroke="#38BDF8" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="880" y2="0" stroke="#818CF8" stroke-width="3">
        <animate attributeName="y1" values="0;220;0" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="0;220;0" dur="3.5s" repeatCount="indefinite"/>
      </line>
      <circle cx="770" cy="110" r="65" fill="none" stroke="#38BDF8" stroke-dasharray="10 6" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0 770 110" to="360 770 110" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="55" fill="#818CF8" font-family="monospace" font-size="14">[ZERO-DAY CLOUD MESH // THEME #12]</text>
      <text x="40" y="112" fill="#38BDF8" font-family="monospace" font-weight="bold" font-size="34">SHADOW-WORKFLOW-DAEMON</text>
      <text x="40" y="155" fill="#E2E8F0" font-family="monospace" font-size="15">STACK: PYTHON  |  ARCHITECT: HAMZA-EVOLUTION</text>
      <rect x="40" y="178" width="460" height="8" rx="4" fill="#818CF8">
        <animate attributeName="width" values="40;460;180;460" dur="2.1s" repeatCount="indefinite"/>
      </rect>
    </svg>